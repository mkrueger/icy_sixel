name: Run tests

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
env:
  CARGO_TERM_COLOR: always
jobs:
  run_checks:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4   
    - name: Check formatting
      run: |
        cargo fmt --all -- --check
    - name: Clippy
      run: |
        cargo clippy --all-targets --all-features -- -D warnings
    - name: Run tests
      run: |
        cargo test --all-features
    # Fuzz targets form a separate workspace and are not covered above.
    - name: Check fuzz target formatting
      run: cargo fmt --manifest-path crates/icy_sixel/fuzz/Cargo.toml --all -- --check
    - name: Check fuzz targets
      run: cargo clippy --manifest-path crates/icy_sixel/fuzz/Cargo.toml --bins -- -D warnings